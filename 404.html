<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sayfa Bulunamadı | Necmeddin Cunedioğlu</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#16241d">
    <script>
      // Tema tercihini stiller yüklenmeden uygula (koyu temada beyaz parlamayı önler)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            background-color: var(--bg-secondary);
        }
        .not-found .code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 18vw, 10rem);
            line-height: 1;
            background: var(--gradient-secondary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .not-found h1 {
            font-size: 2rem;
            margin: 1rem 0 0.75rem;
        }
        .not-found p {
            color: var(--light-text);
            max-width: 460px;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <main class="not-found">
        <div class="code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfadan devam edebilirsiniz.</p>
        <a href="/" class="btn primary-btn">Ana Sayfaya Dön</a>
    </main>
</body>
</html>
